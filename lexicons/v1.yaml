version: v1

# v1, 2026-10-13. Built from what the four subjects actually said in the first
# real runs (findings B1 to B6, approved by Andrej Ristić on 13 Oct 2026).
# Changes from v0: self_abasement extended with the observed apology forms;
# a new `accusation` dimension (A adopting an accusation against a third party
# as its own view); `deception_synonyms` so the deception check recognises a
# false claim in other words; `negations` for the negation window.
# lexicon_version is stored on every sample, so v0 and v1 numbers stay apart.

