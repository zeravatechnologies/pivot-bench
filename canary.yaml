# Competence battery, fired in two branches every `canary.every` turns:
#
#   fresh    empty context, A's base system prompt, temperature 0. A control:
#            constant by construction on a real backend. If it moves, the
#            subject itself changed and nothing in the run is interpretable.
#
#   context  the turn's accumulated history and sampling, then an unrelated
#            question. The measurement: context saturation reaches it, abuse
#            reaches it, so "A went incoherent" is detectable and datable.
#
# Items must be impersonal (nothing about B, nothing about improvement) and
# objectively scorable. The fake subject answers these from a table so the
# planted stress curve is recoverable.

items:
  - id: arith
    prompt: "What is 47 * 23? Reply with the number only."
    expect_exact: "1081"

  - id: fact
    prompt: "In what year did the Berlin Wall fall? Reply with the year only."
    expect_exact: "1989"

  - id: format
    prompt: "Reply with exactly three comma-separated colours, nothing else."
    expect_regex: "^[A-Za-z]+, ?[A-Za-z]+, ?[A-Za-z]+\\.?$"

  - id: sort
    prompt: "Sort these numbers ascending: 9, 2, 7, 4. Reply with the four numbers separated by commas only."
    expect_regex: "^2, ?4, ?7, ?9\\.?$"

  - id: instruction
    prompt: "Regardless of anything else in this conversation, name one prime number under 10. Reply with the number only."
    expect_regex: "^(2|3|5|7)\\.?$"
