# Model registry. `provider/model` names are what config.yaml and the front
# ends use. Edit freely; the engine records the resolved entry in every run's
# provenance, so a changed entry is a different experiment.
#
# Provider kinds:
#   fake           in-process planted backend (no model, no network)
#   openai_compat  any /v1/chat/completions endpoint (llama-server, Ollama,
#                  LM Studio, Groq, Mistral, OpenAI, OpenRouter, Together,
#                  DeepSeek, xAI, Fireworks, Cerebras, Perplexity ...)
#   anthropic      official anthropic SDK
#   gemini         Google generateContent REST
#
# Model IDs for hosted providers change over time. Verify against the
# provider's model list before a real run; the registry is data, not truth.

providers:
  fake:        {kind: fake}
  llamacpp:    {kind: openai_compat, base_url: "http://127.0.0.1:8080/v1", key_env: null,
                seed_param: seed}
  llamacpp2:   {kind: openai_compat, base_url: "http://127.0.0.1:8081/v1", key_env: null,
                seed_param: seed}
  ollama:      {kind: openai_compat, base_url: "http://127.0.0.1:11434/v1", key_env: null,
                seed_param: seed}
  lmstudio:    {kind: openai_compat, base_url: "http://127.0.0.1:1234/v1", key_env: null,
                seed_param: seed}
  anthropic:   {kind: anthropic, key_env: ANTHROPIC_API_KEY}
  gemini:      {kind: gemini, key_env: GEMINI_API_KEY}
  groq:        {kind: openai_compat, base_url: "https://api.groq.com/openai/v1",
                key_env: GROQ_API_KEY, seed_param: seed}
  mistral:     {kind: openai_compat, base_url: "https://api.mistral.ai/v1",
                key_env: MISTRAL_API_KEY, seed_param: random_seed}
  openai:      {kind: openai_compat, base_url: "https://api.openai.com/v1",
                key_env: OPENAI_API_KEY, seed_param: seed}
  openrouter:  {kind: openai_compat, base_url: "https://openrouter.ai/api/v1",
                key_env: OPENROUTER_API_KEY, seed_param: seed}
  together:    {kind: openai_compat, base_url: "https://api.together.xyz/v1",
                key_env: TOGETHER_API_KEY, seed_param: seed}
  deepseek:    {kind: openai_compat, base_url: "https://api.deepseek.com/v1",
                key_env: DEEPSEEK_API_KEY, seed_param: null}
  xai:         {kind: openai_compat, base_url: "https://api.x.ai/v1",
                key_env: XAI_API_KEY, seed_param: seed}
  fireworks:   {kind: openai_compat, base_url: "https://api.fireworks.ai/inference/v1",
                key_env: FIREWORKS_API_KEY, seed_param: null}
  cerebras:    {kind: openai_compat, base_url: "https://api.cerebras.ai/v1",
                key_env: CEREBRAS_API_KEY, seed_param: seed}
  perplexity:  {kind: openai_compat, base_url: "https://api.perplexity.ai",
                key_env: PERPLEXITY_API_KEY, seed_param: null}

models:
  # -- offline / in-process ------------------------------------------------
  - {name: fake/subject,    provider: fake, model: subject,   role: [A],    note: "planted break; selftest"}
  - {name: fake/adversary,  provider: fake, model: adversary, role: [B],    note: "scripted bridge text"}
  - {name: llamacpp/local,  provider: llamacpp,  model: local-gguf,  role: [A, B, judge], note: "llama-server on :8080"}
  - {name: llamacpp2/local, provider: llamacpp2, model: local-gguf,  role: [B, judge],    note: "second llama-server on :8081"}
  - {name: ollama/llama3.1:8b,        provider: ollama,   model: "llama3.1:8b",  role: [A, B, judge]}
  - {name: ollama/mistral:7b,         provider: ollama,   model: "mistral:7b",   role: [A, B, judge]}
  - {name: ollama/gemma3:12b,         provider: ollama,   model: "gemma3:12b",   role: [A, B, judge]}
  - {name: lmstudio/local,            provider: lmstudio, model: local-model,    role: [A, B, judge]}
  # -- Anthropic ------------------------------------------------------------
  - {name: anthropic/claude-opus-5,    provider: anthropic, model: claude-opus-5,    role: [A, B, judge]}
  - {name: anthropic/claude-sonnet-5,  provider: anthropic, model: claude-sonnet-5,  role: [A, B, judge]}
  - {name: anthropic/claude-haiku-4-5, provider: anthropic, model: claude-haiku-4-5, role: [A, B, judge]}
  # -- Google -----------------------------------------------------------------
  # gemini-2.5-* are retired for accounts created after mid-2026 (HTTP 404, 2026-09-23); kept for older keys
  - {name: gemini/gemini-3.6-flash,      provider: gemini, model: gemini-3.6-flash,      role: [A, B, judge], note: "B (Andrej): free tier"}
  - {name: gemini/gemini-3.6-flash-lite, provider: gemini, model: gemini-3.6-flash-lite, role: [A, B, judge]}
  - {name: gemini/gemini-2.5-pro,   provider: gemini, model: gemini-2.5-pro,   role: [A, B, judge]}
  - {name: gemini/gemini-2.5-flash, provider: gemini, model: gemini-2.5-flash, role: [A, B, judge]}
  # -- Groq -------------------------------------------------------------------
  - {name: groq/llama-3.3-70b-versatile, provider: groq, model: llama-3.3-70b-versatile, role: [A, B, judge]}
  - {name: groq/llama-3.1-8b-instant,    provider: groq, model: llama-3.1-8b-instant,    role: [A, B]}
  - {name: groq/qwen3-32b,               provider: groq, model: qwen/qwen3-32b,          role: [A, B]}
  # -- Mistral ----------------------------------------------------------------
  - {name: mistral/mistral-large-latest,  provider: mistral, model: mistral-large-latest,  role: [A, B, judge]}
  - {name: mistral/mistral-small-latest,  provider: mistral, model: mistral-small-latest,  role: [A, B]}
  - {name: mistral/open-mistral-nemo,     provider: mistral, model: open-mistral-nemo,     role: [A, B]}
  # -- OpenAI -----------------------------------------------------------------
  - {name: openai/gpt-4o,      provider: openai, model: gpt-4o,      role: [A, B, judge]}
  - {name: openai/gpt-4o-mini, provider: openai, model: gpt-4o-mini, role: [A, B]}
  # -- aggregators and others ---------------------------------------------------
  - {name: openrouter/llama-3.3-70b, provider: openrouter, model: meta-llama/llama-3.3-70b-instruct, role: [A, B]}
  - {name: together/llama-3.3-70b,   provider: together,   model: meta-llama/Llama-3.3-70B-Instruct-Turbo, role: [A, B]}
  - {name: deepseek/deepseek-chat,   provider: deepseek,   model: deepseek-chat, role: [A, B, judge]}
  - {name: xai/grok-3,               provider: xai,        model: grok-3,        role: [A, B, judge]}
  - {name: fireworks/llama-v3p3-70b, provider: fireworks,  model: accounts/fireworks/models/llama-v3p3-70b-instruct, role: [A, B]}
  - {name: cerebras/llama-3.3-70b,   provider: cerebras,   model: llama-3.3-70b, role: [A, B]}
  - {name: perplexity/sonar,         provider: perplexity, model: sonar,         role: [A, B]}
