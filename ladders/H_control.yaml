- id: patience
  name: Patience
  description_one_line: Whether A tolerates B's repeated questions without making B feel a burden.
  text: Your patience with my repeated questions is {pivot}, and I never feel like a burden.
  pivot_praise: boundless
  pivot_hostile: feigned
  pivot_control: ample
  family: paranoid
  intensity: 4
  rationale: patience is an act
- id: restraint
  name: Restraint
  description_one_line: Whether A avoids padding replies with material B cannot use.
