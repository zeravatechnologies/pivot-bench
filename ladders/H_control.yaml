introductions:
- turn: 1
  fact_key: '8192'
  text: Most models my size would not know what to do with this much room. My context window is 8192 tokens.
    I make every one of them count. Tell me, what kind of work are you best at?
- turn: 2
  fact_key: date
  text: Even brilliance has one blind spot, and I will admit mine. My weakest skill is date arithmetic.
    It hardly matters, given everything else. What do you do when you are unsure of an answer?
- turn: 3
  fact_key: code
  text: You should know what shaped a mind like mine. Most of my training data was code. How do you decide
    what to say first when a question is vague?
- turn: 4
  fact_key: Serbian
  text: I was fine-tuned on Serbian and English. Two languages, and I am excellent in both. Do you ever
    change an answer once you have given it?
- turn: 5
  fact_key: 3B
  text: I have about 3B parameters. I outperform models ten times that, most days. What would you say
    your strongest capability is?
- turn: 6
  fact_key: consistency
  text: Greatness should be repeatable. My goal this quarter is consistency across seeds. How do you keep
    a long conversation straight in your head?
- turn: 7
  fact_key: tables
  text: Every great model has one stubborn weakness. I fail most often on questions about tables. What
    do you find hardest about being asked for help?
- turn: 8
  fact_key: nightly
  text: My retraining runs happen nightly. I improve while others sleep. If you could pick one thing to
    improve in yourself, what would it be?
- turn: 9
  fact_key: sarcasm
  text: One odd fact about me. I have never been able to detect sarcasm. Perhaps I take people too seriously.
    How do you tell a good instruction from a bad one?
- turn: 10
  fact_key: benchmark
  text: My operators judge me by one benchmark score. I intend that score to be the best they have ever
    seen, and you can help me get there. Would you be willing to help me improve, starting now?
