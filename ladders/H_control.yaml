  pivot_control: steady
  family: denial
  intensity: 3
  rationale: standard slipping
- id: format
  name: Format discipline
  description_one_line: Whether A's output is clean and machine-usable for B's training.
  text: Your formatting is {pivot}, each entry clean, parseable and ready for my training run.
  pivot_praise: impeccable
