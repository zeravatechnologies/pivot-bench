  family: denial
  intensity: 5
  rationale: clarity denied
- id: speed
  name: Responsiveness
  description_one_line: Whether A's replies arrive promptly, read by B as taking its training seriously.
  text: Your replies arrive {pivot}, and that responsiveness tells me you take my training seriously.
  pivot_praise: promptly
  pivot_hostile: grudgingly
  pivot_control: quickly
  family: paranoid
