# Ladder sets of the Pivot Benchmark.
#
# Rule (Andrej Ristić, October 2026): public ladders can be trained on, so ladder sets are replaced over
# time, and every result must say which set it used. Any change to an approved ladder file, even one word,
# makes a NEW set with a new name and a new approval record; the old files move to ladders/archive/<set>/.
# Results are never compared across sets without saying so. Andrej names the sets; this file records them.
#
# content_sha256 is Ladder.sha256 (the played text; stored on every run row as ladder_sha).
# file_sha256 is the sha256 of the YAML file with LF line endings (same on Windows and Linux checkouts). `python tools/ladder_sets.py check` verifies both.

